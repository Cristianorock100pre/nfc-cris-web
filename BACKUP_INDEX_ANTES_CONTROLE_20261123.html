const map=L.map('map');

L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  attribution: 'Tiles © Esri'
}).addTo(map);

const markers=[];
function plainText(s){const d=new DOMParser().parseFromString(s||'','text/html');return (d.body.textContent||'').replace(/\\s+/g,' ').trim();}
function openFeature(f){const [lon,lat]=f.geometry.coordinates;const m=markers.find(x=>x.feature===f);if(m){map.setView([lat,lon],17);m.marker.openPopup();}}
for(const f of data.features){const [lon,lat]=f.geometry.coordinates;const marker=L.marker([lat,lon]).addTo(map);
 const title=f.properties.name||'Sem título'; const desc=plainText(f.properties.description);
 const wrap=document.createElement('div');const strong=document.createElement('strong');strong.textContent=title;wrap.appendChild(strong);
 if(desc){const p=document.createElement('div');p.className='desc';p.textContent=desc;wrap.appendChild(p);}
 marker.bindPopup(wrap);markers.push({feature:f,marker,title,search:(title+' '+desc).toLocaleLowerCase('pt-BR')});
}
const bounds=L.featureGroup(markers.map(x=>x.marker)).getBounds();if(bounds.isValid())map.fitBounds(bounds.pad(.08));
function render(q=''){const filtered=markers.filter(x=>x.search.includes(q.toLocaleLowerCase('pt-BR')));document.getElementById('count').textContent=filtered.length+' de '+markers.length+' marcações';const box=document.getElementById('results');box.replaceChildren();for(const x of filtered){const row=document.createElement('div');row.className='item';const b=document.createElement('strong');b.textContent=x.title;row.appendChild(b);row.onclick=()=>openFeature(x.feature);box.appendChild(row);}}
document.getElementById('q').addEventListener('input',e=>render(e.target.value));document.getElementById('clear').onclick=()=>{document.getElementById('q').value='';render();if(bounds.isValid())map.fitBounds(bounds.pad(.08));};render();
